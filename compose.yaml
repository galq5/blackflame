services:
  blackflame:
    image: ghcr.io/galq/blackflame:latest
    build: .
    container_name: blackflame
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      BLACKFLAME_PASSWORD: ${BLACKFLAME_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/blackflame", "healthcheck", "--url", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: expose a read-only Docker API proxy instead of mounting the
  # Docker socket directly into the dashboard. Set the discovery socket to
  # tcp://docker-socket-proxy:2375 in Settings → Discovery.
  #
  # docker-socket-proxy:
  #   image: tecnativa/docker-socket-proxy:latest
  #   container_name: blackflame-docker-proxy
  #   environment:
  #     CONTAINERS: "1"
  #     POST: "0"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   restart: unless-stopped
