{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blackflame.fullname" . }}
  labels:
    {{- include "blackflame.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "blackflame.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    # Discovery, status checks, widgets, icons and DNS need outbound access.
    - {}
{{- end }}
